name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # composer.json promises Laravel 12 and 13, so the suite runs on both.
  package-tests:
    name: package-tests (Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: ['12', '13']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer validate --strict
      - run: composer require "laravel/framework:^${{ matrix.laravel }}.0" --dev --no-interaction --no-update
      - run: composer update --no-interaction --prefer-dist --with-all-dependencies
      - run: ./vendor/bin/pest

  # Apps get the committed dist/ and never run npm, so it must match a fresh
  # build of resources/js/ (and its license notices).
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - name: Fail if dist/ differs from a fresh build
        run: |
          if [ -n "$(git status --porcelain -- dist/)" ]; then
            git status --short -- dist/
            echo "dist/ is out of date: run 'npm ci && npm run build' and commit the result."
            exit 1
          fi

  token-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-tokens.sh

  playground:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci && npm run build
      - run: php artisan test
